name: wagebar
description: 打工进度条 — 把你的真实月薪变成实时游戏进度的开源效率工具
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 加密
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2

  # 通知
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # 图表
  fl_chart: ^0.68.0

  # 工具
  intl: ^0.19.0
  uuid: ^4.4.0
  collection: ^1.18.0

  # 桌面端
  window_manager: ^0.4.2
  tray_manager: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.2
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
